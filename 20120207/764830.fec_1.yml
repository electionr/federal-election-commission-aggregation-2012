- input: "TEXT\x1CC00160937\x1CX0\x1C\x1CF3XA\x1CFederal Election Commission Washington,
    DC 20463   Dear Commissioner:  The following is a response from our committee
    regarding the request for additional information (RFAI) from Ms. Rosa Lewis dated
    October 2, 2009. 1.) As previously communicated, the Committee has refunded the
    excess amount of the contribution in question. This refund was disclosed on Schedule
    B of the July 2011 Monthly Report. 2.) Schedule H4 previously disclosed disbursements
    erroneously reported as allocable. These expenses have been moved to Schedule
    B. The Committee originally reported payroll and payroll related expenses on Line
    21 (a) because these employees did not spend over 25% of their compensated time
    on Federal Election Activity. Additionally, please note employees were compensated
    using only federal funds. If you have any questions or need additional information,
    feel free to contact our committee at (605) 271-5405. Sincerely, Bill Nibbelink,
    Treasurer, South Dakota Democratic Party\n"
