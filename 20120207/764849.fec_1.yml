    DC 20463   Dear Commissioner:  The following is a response from our committee
    regarding the request for additional information (RFAI) from Ms. Rosa Lewis dated
    December 4, 2009. 1.) Column B totals listed on the Detailed Summary Pages have
    been corrected. 2.) The beginning cash balance of this report equals the ending
    cash balance of our 2009 September Monthly Report. A mathematical error accounted
    for this discrepancy. 3.) Schedule H4 previously disclosed disbursements erroneously
    reported as allocable. These expenses have been moved to Schedule B. Employees
    were compensated using only federal funds. 4.) The full name/mailing address has
    been included for vendors listed. If you have any questions or need additional
    information, feel free to contact our committee at (605) 271-5405. Sincerely,
