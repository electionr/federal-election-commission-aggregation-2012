    to further clarify the purpose of one of our expenses.  The software purchased
    on Schedule H4 was a typical campaign database.  The cost was higher than normal
    because the entire year's contract was paid upfront.  Any payroll related items
    on Schedule H4 were for employees that did not spend over 25% of their compensated
    time on federal activity.  Any events or fundraising activity was for the benefit
    of the Committee and did not support a federal candidate.  Any receipts on Schedule
    A, supporting Lines 15 or 17, were assessed at the usual and normal charge.\n"
