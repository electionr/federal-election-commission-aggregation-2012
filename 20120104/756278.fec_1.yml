- input: "TEXT\x1CC00465104\x1C.TEXT\x1C\x1CF3XN\x1CLine 6(a): The Committee is making
    a one-time Cash on Hand adjustment to correct an over-reporting error. The Committee
    has taken appropriate steps to identify any mistakes and is confident that the
    misreporting of funds occurred during a previous election cycle. Of the $73.50
    in misreported funds, $55.00 were identified as individual contributions (Line
    11) and $3.50 as federal operating expenditures (bank fees - Line 21(b)). The
    Committee was unsuccessful in identifying the clerical errors that resulted in
    the remaining $15.00 of misreported funds, and this adjustment serves as a resolution
    of the Cash on Hand discrepancy.\n"
