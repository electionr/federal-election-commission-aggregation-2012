- input: "TEXT\x1CC00277541\x1CX0\x1C\x1CF3XN\x1CThe Fairfax County Democratic Committee
    employs one full time The Fairfax County Democratic Committee employs one full
    time employee, the Executive Director, whose time was more than 25 percent devoted
    to federal elections and candidates during this reporting period.  No other entity
    pays compensation for their employees to work for the Committee. The Committee
    does not engage in any fundraising on behalf of candidates for Federal office,
    so all of its reported fundraising expenses are party fundraising. The Committee
    maintains both Federal and Non Federal accounts.  The Committee will be allocating
    administrative expenses using the 64% - 36% split this year.  As the report was
    being prepared, we noticed that one contributor, Law Firm of Romney Wright, had
    used a credit card to make a $50 contribution which automatically was deposited
    into our federal bank account even though the contribution is not an eligible
    federal contribution.  As soon as we noticed this, on March 12, 2012, we transferred
    $50 to our nonfederal account.  That transfer will be reported in the Committees
    April 20, 2012 FEC report.\n"
