- input: "TEXT\x1CC00236596\x1C.TEXT\x1C\x1CF3XA\x1CIn reply to your memo dated 02/29/2012
    regarding excessive contribution made to Cantor for Congress, this was a clerical
    error.  The contribution was earmarked to Cantor Victory Fund for primary and
    general election.  With regards to excessive contribution made to Olympia Snowe,
    the Committee sent a letter requesting for a full refund of the amount contributed.
    Copy of the letter will be mailed separately.  Refunded amount will be reflected
    in the next report.\n"
