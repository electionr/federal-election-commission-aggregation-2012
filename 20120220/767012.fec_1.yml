    value: 'The transfer from McCain Victory Florida reported on Sch A, line 12, represents
      funds remaining after all expenses paid in a joint fundraising committee. All
      contributions were reported on a prior report. There is a contribution refund
      reported on Schedule B, line 28a in the amount of $4,900. This was paid to the
      Trustee of the Chapter 7 Bankruptcy, Susan Woodard, on behalf of the Estate
      of Craig Berkman. The original contribution was received from Craig Berkman
      on July 17, 2007 in the amount of $10,000. The itemization threshold doesnt
      allow the detail of the transactions for Sch B, line 30b of this report to be
      reflected, but the total for line 30b is correct. There were 4 voided transactions
      that occurred in January 2012 for expenses reported on line 30b (FEA) of prior
      reports. The detail of the voided checks is as follows: 10/1/08 to City of Cocoa
      Beach for $50 for McCain sign permits, 10/1/08 to City of Palm Bay for $150
      for McCain sign permits, 8/20/08 to Kevin Cleary for $100 for payroll and 9/10/08
      to Joseph Culotta for $100 for payroll. There was also 1 transaction for an
      expenditure in the amount of $5 on 1/4/12 to the Florida Division of Elections
      for a voter file. The total of these transactions is -$395 as reflected on line
      30b of the Summary Pages. No expenditure, other than a direct contribution or
      exempt activity so identified, was made on behalf of a specifically identified
      federal candidate. No expenditure not identified as such was for a public communication
      that referred to a clearly identified candidate for Federal office and that
      promoted, supported, attacked or opposed any such candidate for Federal office.
      All expenditures to individuals for rent represent rent income to those individuals
      and are not required to be itemized. All disbursements for salaries and benefits
      disclosed on Schedule H4 are for employees who did not spend more than 25% of
      their compensated time during the reporting period on Federal election activities
      or activities in connection with a Federal election. All transfers for allocated
      activity reported on Sch H3 occurred within the 70-day permitted window of time.
      The Committee uses the Escrow option for receipt of corporate in-kind donations
      as provided for by the Commission in Advisory Opinion 1992-33. The method ensures
      that prohibited sources are not used to fund the federal share of allocable
      activity expenses. In-kind details and the escrow account activity are summarized
      as follows:   COMBINED ESCROW BALANCE OF $18,624.26 as of 12/31/11  Admin escrow
      account activity:  1/23/12 Spearman Management, Inc. in-kind of $4,719 as reflected
      on Sch H4 and transfer on Sch H3 using $1,698.84 of escrow balance.  COMBINED
      ESCROW BALANCE OF $16,925.42 as of 1/31/12  '
