- input: "TEXT\x1CC00513739\x1CX0\x1C\x1CF3A\x1CDear Ms. Sugarman:    \t  Our office
    is in receipt of your correspondence dated August 16, 2012, wherein you requested
    additional information regarding an increase in reported disbursements in the
    amended pre-primary report, submitted on July 15, 2012, which covered the period
    of April 1, 2012 through June 6, 2012.        On June 6, 2012, eight days before
    the pre-primary filing deadline, the campaign experienced a change over in the
    role of treasurer. Following the departure of the first treasurer and following
    the filing of the pre-primary report, it was discovered that several disbursements
    had been previously entered incorrectly. Specifically, disbursements that occurred
    during the pre-primary period were entered with the wrong dates; dates which fell
    beyond the pre-primary period. It was also discovered that four disbursements
    made during the pre-primary filing period had inadvertently been left out of the
    pre-primary filing.  Once these errors were discovered they were corrected and
    an amended pre-primary report was filed.  As a consequence of these corrections,
    certain disbursements were listed in the pre-primary reporting period that had
    previously been listed in either the April or July quarterly periods. The foregoing
    adjustments resulted in an increase to the total disbursements noted on Line 17
    of the amended pre-primary report.       I thank you for your time and attention
    to this matter and remain,       Very truly yours,     Christopher P. Ragucci,
    Esq.   Treasurer  ID No. C00513739        \n"
