- input: "TEXT\x1CC00167130\x1CX0\x1C\x1CF3XA\x1CThe Committee is in receipt of the
    Commission's Request for Further Information dated 09/07/2012 Regarding Schedule
    H4 Memo's not coinciding with the parent expenditure.  The Committee has corrected
    those discrepancies that were linked to the wrong schedule on this amended report.
    \ Please note that the employees that were disclosed on Schedule H4 supporting
    Line 21(a) and Schedule B supporting Line 21(b) as payroll spent less than 25%
    of their time during the period working on any Federal Election Activity or activities
    in connection with a Federal Election therefore salary payments were allocable.
    \ This also includes fringe benefits for those specific employees.    -   Any
    fundraising activity on this report was for the sole benefit of the Committee
    and was not attributable to any candidate for federal office.   -  Memo Schedule
    A's that itemize the committees share of the gross contributions received through
    the joint fundraising activities from the Keystone Victory Fund are provided on
    this report.  The transfer of the joint fundraising proceeds received during this
    reporting period represents the committee's share of proceeds for contributions
    received this period.    -   Memo Schedule A's that itemize the committees share
    of the gross contributions received through the joint fundraising activities from
    the DNC State Party Victory Fund and or ASDC Dollars for Democrats are provided
    on a quarterly basis.  The transfer of the joint fundraising proceeds received
    during this reporting period represents the committee's share of proceeds for
    contributions received during this or prior reporting periods. The memo entries
    for these contributions are included in this or a prior report of the committee.
    \  -    No national transfers were designated for any activity that meets the
    definition of exempt.\n"
