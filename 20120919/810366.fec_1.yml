  - name: TEXT4000
    number: '6'
    value: 'After an internal audit going back to Dec 2011 and after consultation
      with the Reports Analysis Division of the FEC the PAC is reporting an adjustment
      on Sch A Line 17 for 260.00 to correct the PACs cash on hand total to bring
      it into alignment with the PACs bank balance. The adjustment is believed to
      be linked to historical transactions, and the adequacy of payroll file data
      uploads or clerical errors related to calculations for bank deposits. The PAC
      has made adjustments to its management by hiring a new vendor to assist with
      PAC operations and FEC report preparation. The PAC has also reviewed its internal
      operating policies with key personnel, and has upgraded its internal processes
      for data management to include secure, electronic data transfer. Going forward,
      the PAC expects that with these changes, it is unlikely such adjustment as that
      found in this report will be necessary. Amendment also reflects a correction
      to the Column B totals due to the amendment of the m6 report.

'
