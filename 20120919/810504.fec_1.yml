- input: "TEXT\x1CC00271312\x1CX289\x1C\x1CF3A\x1CWe are amending this report in response
    to your letter of September 18, 2012.  The contribution from Carmen Pacheco was
    made online by credit card.  Such credit card contributions are automatically
    downloaded into the database and we did not realize it was being reported as a
    Primary contribution.  This has been corrected - it is now reported for the General
    election.  The contributions from the Truedem Leadership Fund and the NEA Fund
    for Children and Public Education were postmarked on 6/26/12; they were deposited
    on 6/30/12 and because of a data entry error, were incorrectly entered in the
    database as received on 6/30/12.  These entries have been corrected to show the
    received date as 6/26/12.\n"
