- input: "TEXT\x1CC00114439\x1CTEXT-00001\x1C\x1CF3XA\x1CThe Committee is in receipt
    of your letter dated May 1, 2012 (Amended Year-End Report) requesting clarification
    on the Joint Victory proceeds the Committee received in 2011.  In order to provide
    the clearest information on these joint fundraising proceeds, the Committee has
    amended its Statement of Organization, transfers on Line 12, and corresponding
    memo entries to reflect the same information - DNC State Party Victory Fund.  The
    Committee has audited the joint fundraising activity for 2011 and all transfers
    and memos are reflected.  The transfers of the joint fundraising proceeds received
    during 2011 from the DNC State Party Victory Fund represents the Committee's share
    of proceeds for the contributions reported.  Please note that employees of the
    Committee that spent less than 25% of their time on Federal Election Activity
    were paid on the Schedule H4 uniform split.  Expenditures listed on Line 21B did
    NOT meet the definition of Federal Elections Activity. In addition, all fundraising,
    event, and related payments made during this period were Committee fundraising
    and not on behalf of a Federal Candidate.   Please also note that the payments
    to Newman Partners are based on a contractual set amount per month without regard
    to the percentage of funds raised.  Due to the contractual agreement, the FEC
    Reports Analysis Supervisor has ruled that the payments qualify as Admin instead
    Fundraising and may be reported on Schedule H4.\n"
