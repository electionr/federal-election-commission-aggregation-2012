- input: "TEXT\x1CC00025254\x1CX18\x1CD403418\x1CSD10\x1C7/31/12:  The court appointed
    receiver in the matter of Tom Petters, Case No. 08-CV-05348-ADM-JSM contacted
    the Minnesota DFL and demanded the return of contributions allegedly made directly
    by Tom Petters or indirectly through other individuals, all employees of Petters?
    companies and all reimbursed for their contributions.  The Minnesota DFL voluntarily
    agreed to return all such contributions totaling $37,400.  The Minnesota DFL made
    an initial payment of $7,500 in January 2012 and monthly installment payments
    of $1,611.12 from February through June 2012.  Throughout this time, the Minnesota
    DFL and the court appointed receiver continued to negotiate regarding the return
    of additional contributions deposited in the Minnesota DFL?s state account.  The
    court appointed receiver did not cash the checks sent voluntarily by the Minnesota
    DFL.  On July 31, 2012, the court appointed receiver and the Minnesota DFL entered
    into a letter agreement whereby the Minnesota DFL agreed to return all contributions,
    whether direct or indirect, from Tom Petters.  The Minnesota DFL agreed to return
    $37,400, equaling the total amount of Petters? contributions deposited in the
    Federal account, on or before September 3, 2012.  The Minnesota DFL is voiding
    six checks, totaling $15805.60, effective July 31, 2012 to reflect that the court
    appointed receiver did not accept the payments sent by the Minnesota DFL. This
    report at Schedule D now reflects the amount of the debt as of July 31, 2012 (the
    date of the letter agreement) even though the Minnesota DFL voluntarily agreed
    to return the contributions in January 2012.\n"
