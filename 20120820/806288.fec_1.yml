- input: "TEXT\x1CC00415075\x1CF3XN-20120820\x1C\x1CF3XN\x1CWhen the committee has
    Payroll it is reported on H4 and is for employees who spend less than 25 percent
    of their time on FEA.  We currently have no employees that spend more than 25
    percent of their time on FEA and therefore have no wages for Schedule B at this
    time.  Our committee owns their headquarters and has no rent expense or mortgage.
    \  Note on 7/13 we accrued an expense for Van Rental that was reimbursed by the
    California Republican Party,  the subvendor for that is Enterprise Rental and
    will be reflected on our September Monthly when the expense is actually paid.
    \ Additionally there is an accrued expense that is an allocated expense for Schedule
    H and it will reflect the subvendor Office Depot on the September Monthly report
    when it is paid.\n"
