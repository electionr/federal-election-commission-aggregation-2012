- input: "TEXT\x1CC00374231\x1CSB20C.12957.TEXT\x1CSB20C.12957\x1CSB20C\x1CA $2,000
    contribution from the Action Committee for Rural Electrification on 03/07/2012
    was originally reported by the Campaign Committee as all being designated for
    the 2012 Convention. A note accompanying the contribution, however, actually designated
    $500 of the $2,000 towards the General. Due to a clerical error, this was not
    recorded by the campaign correctly. Per phone discussions with the FEC, the appropriate
    report was amended, breaking out the $2,000 contribution correctly ($1,500 for
    the Convention and $500 for the General). The subsequent refund check, which appeared
    on the July Quarterly Report, was voided (since no limits were exceeded after
    all) and this transaction represents the voiding of that refund check.\n"
  record: fec.version.v8_0.TEXT
  result:
  - name: REC TYPE
    number: '1'
    value: TEXT
  - name: FILER COMMITTEE ID NUMBER
    number: '2'
    value: C00374231
  - name: TRANSACTION ID NUMBER
    number: '3'
    value: SB20C.12957.TEXT
  - name: BACK REFERENCE TRAN ID NUMBER
    number: '4'
    value: SB20C.12957
  - name: BACK REFERENCE SCHED / FORM NAME
    number: '5'
    value: SB20C
  - name: TEXT4000
    number: '6'
    value: 'A $2,000 contribution from the Action Committee for Rural Electrification
      on 03/07/2012 was originally reported by the Campaign Committee as all being
      designated for the 2012 Convention. A note accompanying the contribution, however,
      actually designated $500 of the $2,000 towards the General. Due to a clerical
      error, this was not recorded by the campaign correctly. Per phone discussions
      with the FEC, the appropriate report was amended, breaking out the $2,000 contribution
      correctly ($1,500 for the Convention and $500 for the General). The subsequent
      refund check, which appeared on the July Quarterly Report, was voided (since
      no limits were exceeded after all) and this transaction represents the voiding
      of that refund check.

