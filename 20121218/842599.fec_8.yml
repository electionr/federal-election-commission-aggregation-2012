- input: "TEXT\x1CC00075820\x1CT1\x1C\x1CF3XA\x1C\"All payments reported on Line 21b
    are operating and administrative payments solely benefiting and on behalf of the
    National Republican Congressional Committee.  As such, they are not made on behalf
    of any specifically identified federal candidates, nor do they constitute public
    communications or voter drive activity containing express advocacy.  Therefore,
    these disbursements are correctly reported on Schedule B for Line 21b, and do
    not require a Schedule B, Schedule E, or Schedule F for lines 23, 24 or 25. The
    Committee has reviewed all reimbursements to individuals for travel and subsistence
    and confirms that no further itemization is required under any Commission regulations
    for these expenditures.  With respect to coordinated expenditures disclosed on
    Schedule F, the Commission's software only permits one authorizing committee to
    be listed. However, the National Republican Congressional Committee has received
    spending authorization from both the Republican National Committee and the applicable
    state parties.  For Line 28A the itemized amount is higher than the amount on
    the detailed summary pages as a result of voided contribution refund checks that
    do not require itemization. The aggregate coordinated expenditures totals for
    Joseph Carlos, Richard Tubbs, and Kim Vann represent all coordinated expenditures
    on behalf of candidates for the 3rd district of California. The aggregate coordinated
    expenditure totals for Ricky Gill and John McDonald represent all coordinated
    expenditures on behalf of candidates for the 9th district of California.\"\n"
