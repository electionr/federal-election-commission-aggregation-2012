- input: "TEXT\x1CC00477653\x1C2\x1C\x1CF3XA\x1CEarlier this year, CoxPAC discovered
    that, as a result of an inadvertent processing error, $7,565.44 in PAC contributions
    that had been deducted from Cox Communications, Inc. employee paychecks in September
    2011 had not been transferred to the PAC and were instead sitting in an account
    of the PAC's collecting agent, Cox Enterprises Inc.  During the current reporting
    period (April 1 to April 30) and, in accordance with Advisory Opinions 1999-33
    (MediaOne PAC) and 2000-11 (Georgia-Pacific), the collecting agent transferred
    the $7,565.44 to the PAC.  To reflect the fact that these contributions were made
    in September 2011, the PAC is filing amendments to its 2011 year-end report, and
    to its 2012 monthly reports from February, March, and April of 2012.  These amended
    reports are being filed concurrently with the PAC's regular May report.  Finally,
    the PAC has taken proactive measures to help prevent similar errors from occurring
    in the future.  \n"
