- input: "TEXT\x1CC00500587\x1C.TEXT\x1C\x1CF3PN\x1CAs of May 20, 2012 RickPerry.org,
    Inc. began using the filing software provided by the FEC. Unlike all previous
    reports filed, the monthly report filed by RickPerry.org, Inc. due on May 20,
    2012 shows Line 13 totals. However, RickPerry.org, Inc. did not accept matching
    funds and is not required to report expenditures subject to limitations that would
    be shown on Line 13. The Committee has contacted the FEC's technical support in
    an effort to remove this Line 13 total, but tech support was unable to provide
    a solution. Our Staff has also left a message with the Commission's Reports Analysis
    Division notifying our analyst with respect to this issue. If you have any questions
    please feel free to contact us.\n"
