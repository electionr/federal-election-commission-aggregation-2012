- input: "TEXT\x1CC00301929\x1C.TEXT\x1C\x1CF3XA\x1CThis amendment deletes a reported
    contribution to the Angus King For U.S. Senate committee.  The contribution was
    not made during the reporting period.  As a sponsoring organization Kelley Drye
    & Warren, LLP has provided free legal and accounting services to KDW PAC as the
    services are solely to help the committee comply with federal campaign finance
    laws; and, because the individuals performing the services are regular employees
    of the organization consistent with Commission regulations at 100.86. The value
    of those services is $1150\n"
