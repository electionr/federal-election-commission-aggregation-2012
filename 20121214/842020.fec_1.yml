    our 2012 Amended June Report (submitted on December 12, 2012). A mathematical
    error accounted for this discrepancy. 3.) Column A totals listed on the Detailed
    Summary Pages have been corrected.   Please note that several contributions have
    been added to the amended report that were inadvertently omitted from the original
    report.   If you have any questions or need additional information, feel free
