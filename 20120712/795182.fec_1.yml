- input: "TEXT\x1CC00508895\x1C.TEXT\x1C\x1CF3T\x1CMistakingly filed a 48 hour notice
    for $1000 from Glenn Violette on June 14th when in fact it was only $500 donation.
    Piryx system accidentally sent us two emails for the same donation on the same
    day and we felt we needed to disclose it as a $1000 donation on that calendar
    day from one contributor.  It was not however two separate donations and was only
    one that Priyx accidentally sent us two emails on.  It is correct on this report
    as the $500 donation that was received.  Will be disposing of remaining $4.10
    left in campaign account by refunding money to campaign contributor, Charles Bruce
    Kingsley.\n"
