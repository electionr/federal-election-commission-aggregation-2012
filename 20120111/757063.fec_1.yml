    30b.  Since the activity was the result of the void/re-issue of previously reported
    payments, the Committee has removed the void/re-issue entries.  The detail on
    Line 30b now corresponds to the totals on the Detailed Summary Page.  If you have
    any questions, please contact the Committee.  Please note that employees of the
    Committee that spent less than 25% of their time on Federal Election Activity
    were paid on the Schedule H4 uniform split.  Expenditures listed on Line 21B did
    NOT meet the definition of Federal Elections Activity. In addition, all fundraising,
    event, and related payments made during this period were Committee fundraising
    and not on behalf of a Federal Candidate.   Please also note that the payments
    to Newman Partners are based on a contractual set amount per month without regard
    to the percentage of funds raised.  Due to the contractual agreement, the FEC
    Reports Analysis Supervisor has ruled that the payments qualify as Admin instead
    Fundraising and may be reported on Schedule H4.\n"
