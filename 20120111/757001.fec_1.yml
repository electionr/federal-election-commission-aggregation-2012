- input: "TEXT\x1CC00085506\x1C.TEXT\x1C\x1CF3XN\x1C             Line 17.  The Hawaii
    Republican Party Rules state 'To be placed on the Hawaii Republican Party Caucus
    ballot, a candidate must be registered as a Republican Presidentail candidate
    with the Federal Election Commission and pay a $5000 filing fee to the HRP before
    5PM HST ont eh fourth Tuesday in February of a Presidential Election Year.' Accordingly,
    fees were received during December 2011.                 There are no expenditures
    or disbursements for public communications that refer to a clearly identified
    candidate for Federal office or that promote, support, attack or oppose any candidate
    for Federal office as defined under aa CFR section 100.24.  Further, there are
    no public communications that contain express advocacy as defined under 11 CFR
    section 100.22.  There is no portion of any expenditure made on behalf of a specifically
    identified Federal candidate under 11 CFR section 104.3(b) and 106.1.                                                                                                       \n"
