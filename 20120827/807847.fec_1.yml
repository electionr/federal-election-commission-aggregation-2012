    value: 'The May 12, 2012, amendment reflects a new beginning balance following
      our amending of the September 2011 monthly report. T.C. Anderson, Treasurer                  The
      August 27, 2012 amendment to this report is as result of a FEC Request for Further
      Information dated August 9, 2012. The Kansas Republican Party is responsible
      for conducting the Republican Presidential Caucus in Kansas. As a result  all
      caucus expenses listed on this report are inconjunction with that effort and
      none of them refer to a clearly identified candidate. This will be further explained
      in memo texts for each caucus expense. Item 2 in the letter refers to expenditures
      for Caucus Ballots and Caucus Stickers and Ballots. The Republican Party prints
      the ballots and proof of registration stickers for each of the 90 plus caucus
      sites in the state. None of these expenses were made for an activity that promoted
