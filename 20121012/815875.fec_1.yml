- input: "TEXT\x1CC90011875\x1C.TEXT\x1C\x1CF5A\x1CThis report was amended in response
    to the Request for Additional Information dated  September 11, 2012, which asked
    for the itemization of the necessary independent expenditures on our 24-hour report.
    Following the instructions of the Senior Campaign Finance Analyst, we split the
    costs of internet communications for our endorsement of President Obama across
    the remaining state primaries. This amendment also reports the name of the payee
    for the item previously listed as 'Sierra Club'. \n"
