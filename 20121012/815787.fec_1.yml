    a check to Millenium Leadership PAC for $1,500, believing that it was the current
    leadership PAC for Rep. Alcee Hastings.  However, we learned that this PAC is
    no longer being used, and that the current leadership PAC for Rep. Hastings is
    Committed to Win PAC.  APSCUPAC will issue a check to Committed to Win PAC for
    $1,500, which will appear on our next report, and we will also include a negative
    amount of $1,500 for the Millenium Leadership PAC, per FEC procedures.  We will
    include memo texts with each of these entries explaining the action in our next
