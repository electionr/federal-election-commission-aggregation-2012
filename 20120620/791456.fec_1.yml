- input: "TEXT\x1CC00082040\x1C2\x1CA2012-8966\x1CSA17\x1C\"The PAC recently completed
    an Audit of its receipts and expenditures going back to 2009.  We have consulted
    with our reports analysts and were advised that a one time cash adjustment would
    be acceptable to the Commission.  Thus, the adjustment has been made in this report.
    \ The components of the adjustment are as follows: 1) A contribution from John
    Gonzalez of the US Chamber in the amount of $250 received on 5/26/10.  Mr. Gonzales'
    address is 5816 Caladium Dr, Dallas TX 75230-2626, and his occupation is Senior
    Manager at the U.S. Chamber of Commerce;  2) Bank fees from the 2010 election
    cycle in the amount of $9.97; and 3) Unitemized receipts from the 2010 election
    cycle of $633. The remaining amount of $4,146.62 predates 2009.\"\n"
