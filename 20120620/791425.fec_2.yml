      error.  Schedule A Line 15 reflects a number of receipts for the payment of
      rent, telephone and copies. The Democratic Party of Oregon shares office space
      with several organizations. We write one check to pay rent. The amount of rent
      paid by each organization is assessed at the usual and normal charge, determined
