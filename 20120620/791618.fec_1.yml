- input: "TEXT\x1CC00500025\x1C1\x1C\x1CF3XN\x1CThe Committee reports the processing
    costs of earmarks as an independent expenditure.  Per FEC recommendation, an offsetting
    amount is disclosed as an operating expense.  All contributors with aggregate
    contributions exceeding $200 in the calendar year have been contacted to provide
    any incomplete information.  The Committee will amend reports to update any information
    received. All contributions noted as EM indicate a contribution received by Reclaim
    America that was earmarked for a specific candidate. The candidate name is noted
    and the date of transmittal to each candidate is noted.  The matching transmittal
    checks and detail are itemized on line 23.\n"
