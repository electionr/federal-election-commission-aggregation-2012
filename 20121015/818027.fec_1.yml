- input: "TEXT\x1CC00508713\x1CX0\x1C\x1CF3A\x1CAt the time of the filing of earlier
    reports on behalf of Gary Latanich for Congress, neither the current Committee
    treasurer nor the candidate were in receipt of the Stanford Campaign invoices
    which accompanied Mr. Stanford?s Complaint.  The former treasurer, Amanda Boulden,
    had resigned along with Peter Grumbles, campaign manager, and we were unaware
    of the issuance of the post-dated check by Ms. Boulden or the ?informal agreement?
    concerning that check referenced by Mr. Stanford.  Having been made aware of the
    facts, the Committee concurs that the debt should have been reported in accordance
    with 11 CFR Section 116.10.       At the time of the filing of earlier reports
    on behalf of Gary Latanich for Congress, and particularly with respect to Peter
    Grumbles, given the fact that the Committee believes that Mr. Grumbles breached
    its obligations to the Committee when it abdicated its position as a consultant
    during the campaign without first complying with the terms of the Consulting Services
    Agreement between himself and the Committee, by failing to provide services to
    the satisfaction of the Committee,  by then assisting another candidate in the
    same race and misrepresenting to others that Mr. Latanich had withdrawn from the
    campaign, the present Committee treasurer was unaware that Grumbles claimed a
    debts was owed to him by the Committee.  This disputed debt is now the subject
    of civil litigation, and should have been reported in accordance with 11 CFR Section
    116.10  \n"
