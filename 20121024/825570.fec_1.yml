- input: "TEXT\x1CC00024679\x1CX1\x1C\x1CF3XA\x1CThe Vermont Democratic Party (VDP)
    recognizes that the Federal Election Commission requires the committee to report
    the name, address, occupation and employer of individuals whose contributions
    exceed $200 in a calendar year. In the spirit of transparency, the VDP has chosen
    to disclose all of our donors, whether or not their contributions aggregate to
    $200 in a calendar year. The VDP may continue to report unitemized contributions
    from our joint fundraising partners with Dollars for Democrats and the DNC State
    Party Victory Fund.                 ---------                                                                                                       Please
    be advised that the salaries and payroll taxes reported on Schedule H4 were for
    employees who spent 25% or less of their time during the reporting period in connection
    with federal elections or on Federal Election Activity and. In addition, please
    note that unless additional memo text is included, salaries and payroll taxes
    reported on Schedule B Line 30 B were for employees who were not working for a
    specific federal candidate but were involved in Federal Election Activity.\n"
