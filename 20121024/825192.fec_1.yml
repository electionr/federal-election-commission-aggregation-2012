- input: "TEXT\x1CC00301929\x1C.TEXT\x1C\x1CF3XA\x1CThis amendment deletes two improperly
    reported contributions:  A contribution to Welch for Congress on 9/12/12; and
    a contribution to Stutzman for Congress on 9/17/12.  Neither contribution was
    indeed made during the reporting period.  As a sponsoring organization Kelley
    Drye & Warren, LLP has provided free legal and accounting services to KDW PAC
    as the services are solely to help the committee comply with federal campaign
    finance laws; and, because the individuals performing the services are regular
    employees of the organization consistent with Commission regulations at 100.86.
    The value of those services is $1150.\n"
