    value: 'Filing has been amended to correctly identify all disbursees and the purposes
      related to them.  Data entry by the previous treasurer was incorrect.  There
      were never any debts to the campaign.  All items have been paid and future debts
      were entered in error.   2 contribution entries were made for $2500 and $5000
      that were never received nor refunded.  Both were errors by the credit card
      processor or the donor and no funds were ever received.  Neither should have
      been reported to the FEC and have been removed.   Credit card purchases by Mr.
      Bellavia''s personal investment were originally reported, but listed incorrectly
      as loan or debt, but in fact were purely inkind contributions.  Those purchases
      have no aggregated purchases reaching $200 and are unitemized.

