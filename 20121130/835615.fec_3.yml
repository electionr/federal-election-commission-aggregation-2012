  - name: TEXT4000
    number: '6'
    value: 'The payments for rent are for our nightly bingo games which are required
      under State law not reimbursement to the non-federal account. Rent for our nightly
      bingo games is assessed at the usual and normal charge. The maximum allowable
      rents are set by the State of Michigan Charitable Gaming Division of the Michigan
      Lottery based on requirements of the bingo hall.  We pay the maximum rent allowable
      by the Charitable Gaming Division. All salaries and fringe benefits for this
      month reported on Schedule H4 are paid on employees who spent less than 25%
      of their time during this month on FEA. We do not currently have any employees
      spending over 25% of their time on Federal Election Activity; therefore, there
      are no salaries reported on Line 30b.

