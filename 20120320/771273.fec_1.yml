- input: "TEXT\x1CC00024679\x1CX2\x1C\x1CF3XN\x1CThe Vermont Democratic Party (VDP)
    recognizes that the Federal Election Commission requires the committee to report
    the name, address, occupation and employer of individuals whose contributions
    exceed $200 in a calendar year.  In the spirit of transparency, the VDP has chosen
    to disclose all of our donors, whether or not their contributions aggregate to
    $200 in a calendar year.  The VDP may continue to report unitemized contributions
    from our joint fundraising partners with Dollars for Democrats and the State Party
    Victory Fund.    Below please find the full text of the resolution unanimously
    approved by the Vermont Democratic State Committee on March 10th, 2012.      ------------------------------------
    \     WHEREAS, elections in the United States and in Vermont have become increasingly
    affected by the expenditure of money and resources from sources that are not currently
    required to disclose the source of their funds;        WHEREAS, the 2010 mid-term
    federal election was the most expensive ever, costing approximately $4 billion
    compared to the mid-term elections of 2006 which cost $2.6 billion. Figures compiled
    by the non-partisan Center for Responsive Politics indicate $293 million came
    from groups operating independently of the candidates or political parties. Those
    groups, known as ?super PACs,? ?527 organizations,? and ?501 (c) organizations,
    were free to spend without limits and accept unlimited donations from corporations,
    trade associations and unions.        WHEREAS, half of the independent money,
    or $138 million, came from 501 (c) groups that are not required to report their
    donors and millions of dollars more were spent by 527 organizations that have
    reported their spending to the Federal Election Commission without disclosing
    their donors.        WHEREAS, secret spending has a dramatic impact on election
    results. For example, in seats that changed party affiliation in 2010 independent
    groups spent an average of $764,000 on behalf of the winner and just $273,000
    on behalf of the loser, according to figures compiled by Public Citizen.       WHEREAS,
    the Vermont Democratic Party supports full transparency in the financing of political
    campaigns and believes that free speech does not mean freedom to hide the identity
    of the speaker and that doing so does not increase, but diminishes the quality
    of political debate;        WHEREAS, the Vermont Democratic Party is required
    to make regular filings of contributions with the Federal Election Commission
    but is not required to disclose the identity of donors contributing less than
    $200 per calendar year to the Vermont Democratic Party;        WHEREAS, the Vermont
    Democratic Party is required to make regular filings with the Vermont Secretary
    of State but is not required to disclose the identity of donors contributing $100
    or less per election cycle to the Vermont Democratic Party;        WHEREAS, leadership
    on the issue of campaign finance disclosure and reform is a priority for the Vermont
    Democratic Party;        BE IT HEREBY RESOLVED, that the Vermont Democratic State
    Committee directs that all filings of the Vermont Democratic Party reporting contributions
    that are made with the FEC and/or the State of Vermont made from this day forth
    shall include the identity of all donors who make contributions to the Vermont
    Democratic Party without regard to the amount of such contributions.\n"
