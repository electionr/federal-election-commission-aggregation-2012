  - name: TRANSACTION ID NUMBER
    number: '3'
    value: .TEXT
  - name: BACK REFERENCE TRAN ID NUMBER
    number: '4'
    value: ''
  - name: BACK REFERENCE SCHED / FORM NAME
    number: '5'
    value: F3A
  - name: TEXT4000
    number: '6'
    value: 'REFERENCE:  12 DAY PRE-PRIMARY REPORT (1/1/12 TO 4/4/12)                This
      is in response to your letter dated June 13, 2012 of violations in the submitted
      report.  Since that date, the original treasurer, Kenneth Wingert, resigned
      and as the newly registered treasurer, I am responding to your 5 items of concern
      in your letter.  I will respond to all 5 items in the order as listed in your
      letter.     1. ''The candidate informed me that each of the non federal PACs
      were completetly informed of the federal requirements before accepting their
      contribution.  In addition, letters were sent to each one fully stating the
      federal limits and the need to demonstrate through a reasonable accounting method
      that the organization has received sufficient funds subject to the limitations
      and prohibitions in order to make the contribution.''  2.  ''Every disbursement
      regardless of the amount now has a description.''       3.  ''Every disbursement
      regardless of the amount now has a more clarifying description.''     4.  ''All
      reimbursements now have a memo entry including the name, address of the original
      vendor, date, amount & purpose of the original purchase.''     5.  ''The description
      field states Personal Loan and the Personal box is checked.

