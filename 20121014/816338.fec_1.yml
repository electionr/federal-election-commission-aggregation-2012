- input: "TEXT\x1CC00375279\x1C.TEXT\x1C\x1CF3XN\x1CContributions to the Committee
    from conduit, ActBlue, totalled $1,850.00 during this reporting period.  All receipts
    over $200.00 were reported as an itemized items under Section 11(a)(i), which
    totalled $1,250.00. The other receipts were reported as unitemized items under
    Section 11 (a)(ii), which totalled $ 600.00.                                                                                                                                                                      The
    Executive Director, Jessie Kallman-Lizak, provides the Committee with general
    administrative assistance and does not utilize any of her time with federal election
    activity.  Her contract payments reflect the charges she billed the Committee
    as provided in her contract.\n"
