- input: "TEXT\x1CC00173153\x1C34633891\x1C\x1CF3XA\x1CThis is in response to your
    notice dated March 21, 2012, to the American Association of Nurse Anesthetists
    Separate Segregated Fund (CRNA PAC), in reference to our Year-End Report (12-01-2011
    thru 12-31-2011) requesting additional  information. Please note that we received
    correspondence from the Hatch Election Committee (HEC) dated January 19, 2012,
    that we had contributed an excess of $3,000.00 for the General 2012 Election.
    Upon further investigation, we were able to confirm with the HEC that CRNA-PACs
    excess contribution could be re-designated on February 2, 2012, to the Convention
    2012 Election. Re-designation of the contribution took place within the required
    60 day time frame of HECs receipt of the contribution. The CRNA-PAC is amending
    its March 2012 monthly filing to reflect this re-designation of a contribution
    to HEC to the Convention 2012 election.\n"
