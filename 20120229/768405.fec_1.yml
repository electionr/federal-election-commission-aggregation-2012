- input: "TEXT\x1CC00143743\x1C1\x1C\x1CF3XA\x1CFebruary 29, 2012  Mr. Daniel Buckley
    Federal Election Commission Washington, DC 20463  Re:  Amended Year End 2012 Filed
    January 31, 2012 \t Dear Mr. Buckley:  In response to your letter dated February
    14, 2012, regarding contributions from Alamo Pac, we are amending our report to
    correct information previously reported.  We have been notified by Texans for
    John Cornyn in writing that their original letter dated December 31, 2011, contained
    an error and that the in-kind contribution in the amount of $2,631.74, previously
    reported from Alamo PAC, was from Texans for John Cornyn.  Per our recent conversation,
    this amendment to the Partys report changing the name of the donor resolves the
    three issues contained in your letter mentioned above.   Respectfully submitted,
    \ Tom Mechler, Treasurer Republican Party of Texas  \n"
