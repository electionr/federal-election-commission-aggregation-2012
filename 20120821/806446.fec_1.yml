- input: "TEXT\x1CC00522029\x1C.TEXT\x1C\x1CF3A\x1CCharles Malone for Congress:  C00522029
    \ Explaination of July 15 Quarterly Late Submittal:  The July 15 Quarterly, F1
    and F2 was completed and closed by the Treasurer on July 13, 2012.  The Treasurer
    uploaded and submitted what was thought to be all three items.  The F1 was the
    only report that actually was sent.  Then Treasurer thought she had uploaded and
    sent all three at the same time due to the fact that they were closed without
    any errors and the file names had turned pink in color.  The F1 was admended and
    resubmitted as requested by the FEC at a later date.  It was brought to the Treasurer's
    attention on August 20, 2012 that the July 15, 2012 Quarterly was not located
    on the FEC site.  Upon investigation and several phone calls the Treasurer was
    informed that each item to submit has to be uploaded individually and submitted
    individually.  Immediately finding this out the July 15, 2012 Quarterly was uploaded
    and submitted by the Treasurer.  Phone conversations with the FEC analyst are
    documented and this explaination serves as documentation as to what happened in
    this incident.  I am very sorry for any inconvenience this has caused. This campaign
    is a new campaign and  I, as Treasurer for Charles Malone for Congress, strive
    very hard to ensure that Charles Malone for Congress is in complete compliance
    with all Federal Laws and Policies. Sincerely,  Patricia Delaney, Treasurer, Charles
    Malone for Congress\n"
