- input: "TEXT\x1CC00498568\x1CX0\x1C\x1CF3A\x1CFederal Election Commission  999 E
    St NW  Washington DC  20463    RE:  12 Day Pre-Primary Report (01/01/2012 ? 02/29/2012)
    \   In response to your request for additional information dated March 14, 2012
    regarding the above-referenced report, we are amending the report to correct the
    Column B figures.  We also note in this amendment that a refund of the excessive
    online contribution from February 20, 2012, was made to Thomas Little on March
    7, 2012, and a refund of the excessive in-kind contribution dated January 31,
    2012, from Mary Kathryn Pritzker was refunded on March 7, 2012.    As to contributions
    from unregistered committees, the Committee immediately began sending letters
    to the donors requesting confirmation that their contributions used permissible
    funds.  We have noted those donors who have responded affirmatively.  If we do
    not receive confirmation within 30 days from the remaining donors, refunds will
    be made.  The Committee has reviewed its records and discovered errors and omissions
    on the report as originally filed.   This amendment contains corrections to those
    errors.  Additionally, the Committee notes that it has instituted new procedures
    for reviewing and recording contributions and disbursements.   Contributions are
    reviewed for permissibility regarding limits and sources of funds, and action
    is taken to follow-up with donors within 30 days of receipt of any contribution
    which may or may not be permissible.  The Committee is making every effort to
    review information on its reports to the Commission prior to submission to ensure
    complete and accurate disclosure.  Please do not hesitate to contact us if we
    can provide any further information.\n"
