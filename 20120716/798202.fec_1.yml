- input: "TEXT\x1CC00311043\x1CT3-6/30/2012\x1C\x1CF3N\x1CThe cash balance appears
    to have been misstated for several years.  Originally the new Campaign staff was
    waiting for the FEC audit of 2005 and 2006 to be completed.  Once it was determined
    that the audit had been completed, the new Campaign staff attempted to utilize
    the prior staff's Quickbook accounting files.  After determining that this task
    would not work, it was decided to open a new  Quickbooks file - which highlighted
    the incorrect cash balance, which was overstated by $54,347.08.  In addition,
    during 2008, the cash receipts reporting were understated by $1,649.35 and in
    2009 receipts were overstated by $509.49.  In 2010, one deposit totally $7,900
    was inadvertently not included in the quarterly FEC reporting.  All of these adjustments
    have been included.\n"
