- input: "TEXT\x1CC00405225\x1C.TEXT\x1C\x1CF3XN\x1CContributions to the Committee
    from conduit, ActBlue, totalled $ 670.00 during this reporting period. All receipts
    over $200.00 were reported as an itemized items under Section 11(a)(i), which
    totalled $500.00. The other receipts were reported as unitemized items under Section
    11 (a)(ii), which totalled $170.00. The Office Executive Director, Layma Murtaza,
    provides the Committee with general administrative assistance and does not utilize
    any of her time with federal election activity. Her contract payments reflect
    the charges she billed the Committee as provided in her contract.\n"
