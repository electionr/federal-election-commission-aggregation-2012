- input: "TEXT\x1CC00462630\x1C.TEXT\x1C\x1CF3XN\x1CCovington & Burling LLP PAC made
    a $2,000 pre-payment on 2/16/2011 (Transaction ID: SB21B.6504) to off-set inkind
    contributions of staff time for non-compliance related matters. These funds have
    been retained by Covington & Burling LLP as an off-set to potential staff time
    in excess of $5,000, as reported in our February Monthly report (Transaction ID:
    SB21B.4872). As reported in our pre-general report, Covington & Burling LLP PAC's
    year-to-date federal operating expenditures totaled $5,391.02.  Accordingly, the
    $2,000 prepayment was used to off-set an excess of $391.02 in federal operating
    expenditures, leaving a prepayment balance of $1,608.98.  In this reporting period,
    the remaining prepayment balance of $1,608.98 is used to off-set $341.30 in federal
    operating expenditures.  The balance of the prepayment is now $1,267.68, which
    Covington & Burling LLP will continue to retain.\n"
