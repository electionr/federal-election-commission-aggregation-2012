- input: "TEXT\x1CC00503888\x1C.TEXT\x1C\x1CF3XN\x1CSoutheastern Pennsylvania Manufacturers
    PAC has demonstrated the necessary steps to establish best efforts to obtain and
    disclose the full identification of all individuals who contribute in excess of
    $200 in an election cycle. These efforts include a clear and conspicuous request
    with the original solicitation that informs the contributor of the requirements
    of federal law. This is followed by a Request for Missing Information letter,
    send within 30 days of the original contribution, which clearly asks for the missing
    information, without soliciting a contribution. In addition, the letter reads:
    Federal law requires us to make our best efforts to collect and report the name,
    mailing address, occupation and name of employer of individuals who contribute
    in excess of $200 in an election cycle. We then enclose a self-addressed envelope
    and include a telephone number to reach the committee with any questions. A second
    Request for Missing Information letter is sent if we do not receive the information
    in a timely manner. In the event that we receive additional information from contributors
    whose information was not originally disclosed, we will amend the appropriate
    report to reflect the additional disclosures properly.\n"
