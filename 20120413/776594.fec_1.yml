- input: "TEXT\x1CC00161265\x1C1\x1C\x1CF3XN\x1CA large un-itemized total is shown
    on line 11 in the amount of $155,272.03.  These contributions primarily range
    in amounts from $1 to $5 and are from individual Farm Bureau members collected
    during the annual membership drive.  These contributions would not cause any individual
    member to exceed the $200 threshold in total contributions which would require
    itemization of their contribution.  In regards to the debt listed on line 21B
    and Schedule D line 10, AGGPAC hosted a reception for Schmidt for Congress Committee
    on February 23, 2012 at the Athletic Club of Columbus.  The PAC intended to pay
    for $746.85 worth of catering that would represent an in-kind contribution to
    Schmidt for Congress Committee.  The in-kind contribution would be designated
    for the 2012 primary election cycle.  However, the Athletic Club billed the connected
    organization (Ohio Farm Bureau Federation) instead of directly billing the PAC.
    \ The bill was received by the connected organization's accounting department
    and paid by the connected organization on March 13, 2012.  Since discovering this
    billing error in the process of preparing this April 15th quarterly PAC report,
    the PAC has reimbursed the connected organization.  Because this billing error
    was discovered after the reporting period ended, per a phone conversation with
    an FEC analyst regarding this matter, it is our understanding that the PAC is
    to report a debt owed by the committee in the amount of $746.85 on this PAC report
    and to report the debt being paid in full as well as report the in-kind contribution
    to Schmidt for Congress Committee on the next quarterly FEC report for period
    ending June 30th.\n"
