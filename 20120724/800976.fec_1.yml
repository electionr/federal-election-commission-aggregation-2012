- input: "TEXT\x1CC00514653\x1CT1\x1C\x1CF3XA\x1C\"The Committee files this amendment
    in response to the Commission's request for additional information dated June
    19, 2012.  The Commission raises 5 issues, which are addressed below. 1. Independent
    Expenditure--Schedule E has been reflected to properly report the states in which
    the independent expenditure was made. 2. Schedule H4 Mailing Addresses--The amended
    report no longer includes schedule H4, but all entries on other schedules include
    mailing addresses. 3. Purpose of disbursement on H4--The amended report no longer
    includes schedule H4, but all entries on other schedules now have adequate purposes
    of disbursement listed. 4. Itemization of reimbursements on H4--The amended report
    no longer inlcudes schedule H4, but all entries on schedule B include itemization
    where the total payment to an individual exceeds $500 and payments to any vendor
    aggregating over $200. 5. H4 Non-Federal Activity--The amended report does not
    include schedule H4. The expenditures listed on schedule H4 should have been reported
    on line 21B of schedule B; this amended report properly reflects these expenditures.
    In addition to addressing the issues raised by the Commission, the Committee has
    identified some expenditures which were not reported on its initial report, but
    should have been. All expenditures are reflected on this amended report.\"\n"
