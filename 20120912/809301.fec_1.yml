- input: "TEXT\x1CC00213066\x1C.TEXT\x1C\x1CF3XN\x1COn August 14, 2012, APSCU employees
    Robbe Bendick and Gregory Rovick spoke with FEC analyst Dan Buckley regarding
    the issue with our bank service charges being reported on the wrong line in the
    FEC report.  The total amount to be corrected was $607.74.  APSCUPAC has been
    able to correct the issue with our August 20, 2012 monthly report, filed August
    15, 2012.  APSCUPAC does not need to file an amendment to resolve the issue; having
    filed the report on August 15, 2012, the issue has been taken care of.  Dan relayed
    that he would be happy to talk with APSCUPAC's treasurer to ensure for him that
    the issue is resolved and no further action is required.\n"
