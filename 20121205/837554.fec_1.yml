- input: "TEXT\x1CC00488494\x1C.TEXT\x1C\x1CF3XN\x1CThis report includes several Schedule
    E, Line 24 entries for which 24-hour notices were not filed. They reflect the
    payment of balances due on voter telephone contact programs for which funds were
    paid in advance and reported on 24-hour notices. The initial payments were estimates
    of the cost of the program. After the programs were run, the Committee was invoiced
    for additional costs based on completion rates and time spent calling. These entries
    are for 10/23 and 10/29. The Committee consulted with its assigned analyst in
    the Reports Analysis Division, who indicated that this was an acceptable method
    of reporting such transactions.\n"
