    reporting exempt legal and accounting services provided to the PAC by Dickstein
    Shapiro LLP incorrectly over several reports.  While the amount of services provided
    was accurately disclosed on all reports, the PAC should have reported the services
    on Schedule A as a memo entry.  Moving forward, the PAC will follow the FEC guidance
    and report exempt legal and accounting services as a memo entry on Schedule A.\n"
