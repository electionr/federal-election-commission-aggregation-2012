      and are not in connection with a Federal candidate or Federal Election Activity.  All
      payments for salaries, payroll taxes and healthcare premiums that are reported
      as administrative are not paid on behalf of employees who spent more than 25%
      of their compensated time on Federal Election Activity.   This report discloses
