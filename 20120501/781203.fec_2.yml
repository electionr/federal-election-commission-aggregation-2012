- input: "TEXT\x1CC00208991\x1CTEXT-00001\x1C\x1CF3XA\x1C-Schedule A supporting Line
    11(a)(i) has been amended to disclose that the $10,000 in activity was a transfer
    from the Nevada Senate Victory Fund.  Line 11(c) of Itemized Receipts has been
    amended to disclose the correct name and committee identification of the contribution
    in question.  The initial report listed the contribution from Sierra Pacific Employees
    PAC; the company has changed their name to NV Energy but the old name was listed
    on the check the committee received.  All disbursements that are reported on Schedule
    H-4 are administrative and are not in connection with a Federal candidate or Federal
    Election Activity.  All payments for salaries, payroll taxes and healthcare premiums
    that are reported as administrative are not paid on behalf of employees who spent
    more than 25% of their compensated time on Federal Election Activity.   This report
    discloses the transfer of joint fundraising proceeds from the Swing State Victory
    Fund and the Nevada Senate Victory Fund.  Checks from the Swing State Victory
    Fund and the Nevada Senate Victory Fund were deposited in January 2012 and will
    be reported on the February Monthly Report (01/01/2012-01/31/2012).\n"
