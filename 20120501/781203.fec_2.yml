  - name: TEXT4000
    number: '6'
    value: '-Schedule A supporting Line 11(a)(i) has been amended to disclose that
      the $10,000 in activity was a transfer from the Nevada Senate Victory Fund.  Line
      11(c) of Itemized Receipts has been amended to disclose the correct name and
      committee identification of the contribution in question.  The initial report
      listed the contribution from Sierra Pacific Employees PAC; the company has changed
