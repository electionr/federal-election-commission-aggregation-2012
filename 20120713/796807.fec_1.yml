- input: "TEXT\x1CC00509893\x1C1\x1C\x1CF3XN\x1CThe Committee is aware of the regulations
    regarding the disclosure of the name, address, employer and occupation of every
    contributor who contributes more than $200 aggregate in a calendar year.  The
    Committee fully discloses all contributor names and other information as they
    are indicated by the contributor.   Every solicitation includes a clear and conspicuous
    request for the contributor information and informs the contributor of the requirements
    of federal law to report this information.  If the information is not received
    with the contribution, the contributor is contacted within 30 days either by mail,
    by telephone or by email to obtain the missing information.  All requests clearly
    ask for the missing information without soliciting further contributions, inform
    the contributor of the requirements of federal law for reporting this information,
    and, if the request is by mail, include a pre-addressed return envelope.\n"
