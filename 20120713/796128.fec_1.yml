    value: 'Please note: Southeastern Pennsylvania Manufacturers PAC has demonstrated
      the necessary steps to establish best efforts to obtain and disclose the full
      identification of all individuals who contribute in excess of $200 to the committee.
      These efforts include a clear request with the original solicitation, followed
      by a Request for Missing Information Letter, which clearly asks for the missing
      information, without soliciting a contribution. In addition, the letter reads:
      Federal law requires us to make out best efforts to collect and report the name,
      mailing address, occupation and name of employer to individuals who contribute
      in excess of $200. We then enclose a self-addressed envelope and include a telephone
      number to reach the committee with any questions. The committee has exercised
      its best efforts to collect the address for Timothy Flynn. These efforts include
      but are not limited to a request with the original solicitation, and follow
      ups with fundraisers and event staff to obtain the information. In the event
      that we receive additional information from contributors whose information was
      not originally disclosed, we will amend the appropriate report to reflect the
      additional disclosures properly.

