    \ 1) All of our original solicitation materials include a clear and conspicuous
    request for contributor information, including employer and occupation information.
    \ 2) If the requested information is not provided  by the contributor, the campaign
    manager sends a written request for the missing information without soliciting
    a contribution, informs the contributor of the legal requirements, and includes
    a pre-paid return envelope.  3) If the outstanding information is collected the
    quarterly FEC report is amended and sent electronically to the FEC.\n"
