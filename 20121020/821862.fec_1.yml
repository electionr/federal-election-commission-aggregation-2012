- input: "TEXT\x1CC00031088\x1C1\x1C\x1CF3XA\x1CNo employee whose salary or benefits
    appears on schedule H4 spent more than 25 percent of their compensated time on
    Federal Election Activity this month.   This amendment, corrects beginning cash
    totals consistent with previously amended April, May, and June reports.  This
    amendment moves several employee salaries and booth rental expenses from line
    21b to line 30b (FEA).  These expenses were paid with 100 percent Federal funds.
    \ This amendment moves several expenses from operating expenses to joint activity
    and one expense from joint activity to FEA to properly characterize the expenses.
    \ The net efect of these changes is to increase the amount of allocable expenses
    by about $100.00. \n"
