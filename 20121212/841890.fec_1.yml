- input: "TEXT\x1CC00160937\x1CX0\x1C\x1CF3XA\x1CFederal Election Commission Washington,
    DC 20463 Dear Commissioner: The following is a response from our committee regarding
    the request for additional information (RFAI) from Ms. Rosa Lewis dated November
    13, 2012. 1.) Column B totals listed on the Detailed Summary Pages have been corrected.
    2.) The beginning cash balance of this report equals the ending cash balance of
    our 2012 Amended May Report (submitted on November 21, 2012). A mathematical error
    accounted for this discrepancy. 3.) The Radio Advertisements 'attacked' Noem but
    did not expressly advocate the election or defeat of any candidate so the ad was
    properly disclosed on Line 30(b) as Federal Election Activity.  In addition, the
    disbursement of $329.52 on 5/17/2012 to Benjamin Nesselhuf for travel expense
    was mistakenly reported as Joint Federal/Non-Federal Activity on the original
    June Monthly report.  This disbursement has been corrected to an Operating Expenditure.
    \  A contribution refund of $41.50 to Travelers Motor Club Sales, Inc. from 1/31/2012
    was voided on 5/10/2012 and has been included in this report.    If you have any
    questions or need additional information, feel free to contact our committee at
    (605) 271- 5405. Sincerely, Bill Nibbelink, Treasurer, South Dakota Democratic
    Party  \n"
