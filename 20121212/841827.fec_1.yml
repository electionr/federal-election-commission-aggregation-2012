- input: "TEXT\x1CC00457234\x1C.TEXT\x1C\x1CF3XA\x1CAs assistant treasurer of the
    Marsh & McLennan Companies, Inc. PAC (MMCPAC), I am writing in response to your
    letter dated November 20, 2012 addressed to Mr. Alan Bieler, treasurer of MMCPAC.
    \ This letter is to clarify that the contributions disclosed in Schedule B supporting
    Line 23 of the July Quarterly Report (04/01/2012 - 6/30/2012) referenced in your
    communication were not earmarked contributions made by MMCPAC, but were contributions
    made to the enumerated leadership political committees with no direction or control
    exercised over how the funds were to be used.  The July Quarterly Report has been
    amended to reflect the leadership PACs as the ultimate recipient of these contributions.
    Karen Farrell, Assistant Treasurer\n"
