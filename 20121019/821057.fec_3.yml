    wages and employment taxes for staff that did not spend in excess of 25% of their
    time on activites in connection with a federal election. Once an employee works
    over 25% of their time on activities in connection with a federal election activity
    thier salary, payroll taxes and benefits are paid 100% Federal.  This report includes
    Memo Schedule A entries for contributions raised by the DNC State Party Victory
    Fund Program, and the Dollars for Democrats Program.  The committee may not have
    received its share of the proceeds as of the end of the reporting period.  The
    committee expects to receive transfers at some point in the three months following
    this reporting period.\n"
