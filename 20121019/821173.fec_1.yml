- input: "TEXT\x1CC00031088\x1C1\x1C\x1CF3XA\x1CNo employee whose salary or benefits
    appears on schedule H4 spent more than 25 percent of their compensated time on
    Federal Election Activity this month. This amendment, and amendments to the WSRP
    April and May reports, is submitted in connection with a sua sponte submission
    by the Committee to the Commission. This amendment adds receipts related to the
    WSRP state convention that were inadvertently omitted from the original report.
    \ In response to the RFAIs of September 24 and October 17, 2012 regarding the
    June and July Monthly reports, WSRP had no employees who devoted more than 25%
    of their compensated time to Federal Election Activity this month.  During May
    party staff devoted nearly all of their time to planning and organizing the state
    party convention, which is not a Federal Election Activity. A booth rental expense
    has been moved from Schedule B Line 21b to Schedule B Line 30b in response to
    the RFAI.  No overfunding of the Federal account was involved because both lines
    are entirely Federal (not allocated). Communications expenses listed on Schedule
    H4 were for administrative expenses and not for public communications.  Descriptions
    of those expenses have been clarified on this amendment. \n"
