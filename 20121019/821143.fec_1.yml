    that were not publicly disseminated during this reporting period, but instead
    will be disseminated in future reporting periods.  For the following items, a
    negative amount is reflected for each on Line 21b of this report and a correspoonding
    positive amount is reflected on Line 24.  For the Line 21b negative entries, the
    full purpose of disbursement should be noted as Transfer to Line 24, Independent
    Expenditures disseminated.  For the Line 24 corresponding positive entries, the
