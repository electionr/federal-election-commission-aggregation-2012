- input: "TEXT\x1CC00111278\x1C1\x1C\x1CF24N\x1CThe 48-Hour reports filed by the Committee
    on 10/10/2012 and 10/12/2012 indicated that the Committee made three Independent
    Expenditures in support of Marco Rubio for Florida Senate. Each of these three
    expenditures was actually made in support of Connie Mack for Florida Senate. The
    expenditures took place on 10/08/2012 for $7,593.40, on 10/09/2012 for $78,748.20,
    and on 10/10/2012 for $3,930.48. The correct information will appear on the Pre-General
    Election report. \n"
