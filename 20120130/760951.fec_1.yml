    is removed from Schedule D.  The candidate was forgiven the debt in exchange for
    ownership rights to the committee donor list. Equipment owned by Comcast was returned
    to them in December 2010 and extinguishes the debt obligation. That return is
    reflected as a payment this period and the previously reported debt to Comcast
    is now zero. The petty cash deposited reported on Line 15 is the net amount not
    previously included in cash on hand.\n"
