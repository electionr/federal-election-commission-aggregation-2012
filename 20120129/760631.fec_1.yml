- input: "TEXT\x1CC00483412\x1C.TEXT\x1C\x1CF3XN\x1CAs previously disclosed, the former
    treasurer utilized the non-federal account for paying Committee disbursements
    then transferred funds from the federal account in error to cover its allocated
    share.  An audit discovered the situation and the Committee accounts were adjusted
    to reflect the correct disbursements and non-federal transfers. The Committee
    on November 3, 2011 transferred said funds from the non-federal account to the
    federal account in order to bring the Committee accounts in balance. Since that
    date, all expenses were paid in accordance with federal rules and regulations
    and the Committee is taking considerable care to comply as such.\n"
