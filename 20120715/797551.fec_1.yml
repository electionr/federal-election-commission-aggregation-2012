    registered as a Super PAC.  It is treating it's existing Carey Account the same,
    and as of the transactions in this report switching all receipts/expenditures
    to and from that account to that proscribed for Carey Account (line 17 receipts,
    line 29 expenditures).  The Committee may begin engaging in Traditional PAC activity
    from amount and source restricted funds as of the third quarter 2012.\n"
