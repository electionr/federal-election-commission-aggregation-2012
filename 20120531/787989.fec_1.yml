- input: "TEXT\x1CC00464487\x1C.TEXT\x1C\x1CF3A\x1CMay 31, 2012 - Nunnelee for Congress
    C00464487 Response to FEC RQ-2 letter dated April 26, 2012 as follows:  Item 1:
    \ Refund checks were issued to Coahoma County Memorial Gardens Cemetery, Mississippi
    Realty & Appraisal Service and Vision Engineering.  New Beginnings was a typo
    and should have benn an individual contribution for Joshua H Newman.  Mississippi
    Coalition for Progress is a state pac and these are permissible federal funds.
    \ Item 2:  Refund checks were issued to John P Fullenwide for $150 and J Morgan
    for $5,000.  Item 3:  The contribution from Linder for Congress has been corrcted
    to show $2,000 for P2012 and $500 for G2012.  Item 4:  Mississippi Coalitiation
    for Progress is a state pac not registered with the FEC.  Copies of all refund
    checks are being mailed today via USPS.  Paul V Breazeale, Treasurer\n"
