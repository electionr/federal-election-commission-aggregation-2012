- input: "TEXT\x1CC00274944\x1C.TEXT\x1C\x1CF3XN\x1CJuly 17, 2012                                                                                                                                                                                                                                                                                                                                                                                              Due
    to a recent customer migration from from Ablaze software to Oracle software not
    all PAC payments for June, 2012, were recorded. There are $2,550.00 that we will
    record next month or the following month.  Our IS team is workking diligently
    on our system to allow for these types of payments.  Until our system is able
    to accept these dollars, we are manually tracking each contribution to make sure
    it is reported in the near future. Please contact me should you have any questions.
    \                                                                                                                                                                         Sincerely,
    \                                                                                                                     Rosa
    A. Rosado                                                                                                            College
    of American Pathologists                                                                                  847-832-7307\n"
