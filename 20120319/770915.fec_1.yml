- input: "TEXT\x1CC00499657\x1C.TEXT\x1C\x1CF3XA\x1CPlease accept the amendment as
    the PAC's response to your Request For Additional Information.  The following
    is a detailed description of the Committee's current 'best efforts' procedures:
    1) All solicitations include a clear and conspicuous request for the contributor's
    full name, mailing address, employer, and occupation.  Additionally, all solicitations
    inform the contributor of the federal requirement for reporting this information.
    2) If the information is not provided when a contribution is received, a representative
    of the PAC makes one follow-up attempt to obtain this information within 30 days
    of receipt by letter, e-mail, or phone call documented in writing.  3) If additional
    information is received after a report has been filed, an amendment may be filed
    that discloses the additional information that has been received.\n"
