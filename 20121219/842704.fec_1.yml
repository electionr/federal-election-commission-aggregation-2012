- input: "TEXT\x1CC00011197\x1CTEXT-00001\x1C\x1CF3XA\x1CThis amendment is being filed
    to address questions posed by the Commission:    1.  This report, combined with
    previous amendments, corrects summary page totals.    2.  The Committee does not
    report any wages on Schedule B, Supporting Line 30b, because no employee spent
    over 25% of thier compensated time on federal activity.    3.  The payments for
