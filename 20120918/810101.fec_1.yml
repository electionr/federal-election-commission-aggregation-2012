    period, we received three receipts totaling $10,000 from Cravaack for Congress
    for 2010 General and 2012 Primary Election contribution refunds.  We requested
    the refunds since the campaign designated them to the incorrect elections. We
    also redesignated a $2,500 ontribution from 6/6/2012 from 2012 General to 2012
    Primary and issued a $2,500 2012 Primary contribution on 7/23/2012 to replace
    the earlier 2012 primary refunds.  Amended ytd cash on hand due to accounting
    error.\n"
