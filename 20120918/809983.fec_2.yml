- input: "TEXT\x1CC00468579\x1CT1\x1C\x1CF3A\x1C\"This amended report responds to
    a Request for Additional Information dated August 17, 2012. The RFAI raises three
    issues, each of which is addressed herein. (1) Potentially Excessive Contributions--(a)
    Individual Contributions--Ms. Rodino's contribution has been redesignated and
    the redesignation is reflected in this report; The Committee made a timely request
    for reattribution to Mr. Boyd and will report the reattribution on the Oct 15
    Quarterly report. (b) Unregistered Organizations--the Committee has verified that
    contributions from these organizations come from acceptable funds and has annotated
    the transactions. (2) LLC Contributions--The Committee has confirmed acceptable
    funds and attributed the contributions to the members for 4 of the 5 LLCs. The
    Committee made a timely request to Lions Head Development, LLC, and will report
    the verification of funds and attribution to members on the Oct 15 Quarterly Report.
    (3) Earmarked Contributions--The Committee has added memo entries to reflect the
    contributions earmarked through two conduits omitted from the initial report--Club
    for Growth and SBA List Fund. Additionally, the Committee corrected errors in
    Schedule B increasing the total expenditures by just over $2,000.\"\n"
