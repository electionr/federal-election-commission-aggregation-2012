    National Republican Congressional Committee.  As such, they are not made on behalf
    of any specifically identified federal candidates, nor do they constitute public
    communications or voter drive activity containing express advocacy.  Therefore,
    these disbursements are correctly reported on Schedule B for Line 21b, and do
    not require a Schedule B, Schedule E, or Schedule F for lines 23, 24 or 25. The
    Committee has reviewed all reimbursements to individuals for travel and subsistence
    and confirms that no further itemization is required under any Commission regulations
