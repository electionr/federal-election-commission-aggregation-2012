- input: "TEXT\x1CC00409003\x1C1\x1C\x1CF3XA\x1COctober 30, 2012  Kevin Fortkiewicz
    Reports Analysis Division Federal Election Commission 999 E 9th Street\t Washington,
    DC  20463  Dear Kevin,  This letter is in response to your October 18, 2012, letter
    of inquiry regarding the July Quarterly Report (04/01/2012-06/30-2012) for Heartland
    Values PAC (C00409003).  We have reviewed our records supporting the above-referenced
    report and provide the following additional information in response to your questions:
    \ A review of the reports filed by your committee indicates that your committee
    received one or more transfers from another Committee (see attached): We received
    check #1639 from H.J. Heinz Company Political Action Committee which was deposited
    on May 8th, 2012.  I am not able to attach a copy of this check, but if needed,
    I will send to you via email or the USPS. I checked H.J. Heinz FEC reports and
    found their contribution to us in their October Quarterly report, dated July 13th,
    2012.  No correction is necessary on our report.   Schedule B supporting Line
    23 discloses a contribution to Hatch Election Committee Inc. which is designated
    to the primary election with a purpose field that indicates Convention Contribution:
    \ The Primary 2012 box was checked in error.  The Other (specify) box should have
    been checked.  This has been corrected and the amended report has been submitted
    with this letter.   We trust this information answers your questions.  If you
    have any further questions or need additional information, please do not hesitate
    to contact me at 605/376-3437.  Sincerely,  Barb Buell Deputy Treasurer Heartland
    Values PAC PO Box 505 Sioux Falls, SD  57101-0505\n"
